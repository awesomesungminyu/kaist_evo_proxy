[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaist-evo-proxy"
version = "0.1.0"
description = "EvoScientist adapter for a frozen candidate mixer evaluation harness"
requires-python = ">=3.11"
dependencies = ["gdown==5.2.0", "PyYAML==6.0.2"]

[project.scripts]
evo-proxy = "evo_proxy.cli:main"

[tool.setuptools]
packages = ["evo_proxy"]

[tool.setuptools.package-data]
evo_proxy = ["drive_manifest.json"]
