[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaist-evo-proxy"
version = "0.1.0"
description = "EvoScientist adapter for a frozen candidate mixer evaluation harness"
requires-python = ">=3.11"

[project.scripts]
evo-proxy = "evo_proxy.cli:main"

[tool.setuptools]
packages = ["evo_proxy"]
